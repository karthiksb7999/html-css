<!DOCTYPE html>
<html lang="en">
<head>


	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title> Modern Product UI Card </title>
	<link rel="stylesheet" href="style.css">

</head>


<body>

	<div class="product-card"> 

	<p class="tag"> 🔥 Best Seller Shoes </p>

	<img src="images/image.png" width="250px" alt="nike Shoes">


	<h1> Nike Air Shoes Max 270 </h1>


	<div  class="ratings">

<span style="color: #FFD700; font-weight: bold;">⯪ 4.8 . 2.3k reviews</span>

	</div>



	<p class="description">

	Premium running Shoes designed <br>
	for its performance and its comfort.


	</p>

	<div class="price-section">
	
	
		<span class="new-price">$52.20</span>&nbsp; &nbsp;
		<span class="old-price"> <del>$83.65</del></span>


	</div>


	<p class="discounts"> 35% off </p>


	<div class="sizes">Sizes:

	<span> 7 </span>
	<span> 8 </span>
	<span> 9 </span>
	<span> 10 </span>

	</div>


	<button>        Add to Cart        </button>

</div>
</body>
</html>
