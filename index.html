<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Modern Product Card</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="product-card">

    <p class="tag">🔥 BEST SELLER</p>

     <img src="images/image.png" width="300" alt="Nike Shoes">

    <h1>Nike Air Max 270</h1>

    <div class="rating">

        ⭐ 4.8 • 2.3k Reviews

    </div>

    <p class="description">

        Premium running shoes designed
        for comfort and performance.

    </p>

    <div class="price-section">

        <span class="new-price">₹4,999</span>

        <span class="old-price">₹7,999</span>

    </div>

    <p class="discount">35% OFF</p>

    <div class="sizes">

        <span>7</span>
        <span>8</span>
        <span>9</span>
        <span>10</span>

    </div>

    <button>Add To Cart</button>

</div>

</body>

</html>
